services:
  autopilot-data-init:
    build: .
    command: ["chown", "-R", "appuser:appuser", "/data"]
    user: root
    restart: "no"
    volumes:
      - autopilot-data:/data

  autopilot:
    build: .
    command: ["substack-autopilot"]
    restart: unless-stopped
    depends_on:
      autopilot-data-init:
        condition: service_completed_successfully
    env_file:
      - .env.autopilot
    environment:
      SUBSTACK_AUTOPILOT_STATE_PATH: /data/autopilot.sqlite3
      SUBSTACK_AUTOPILOT_ARTIFACT_DIR: /data/artifacts
    volumes:
      - autopilot-data:/data

volumes:
  autopilot-data:
